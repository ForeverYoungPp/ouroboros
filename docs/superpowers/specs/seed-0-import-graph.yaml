constraints:
- 本阶段不删除任何文件，只切断 import 依赖。
- 探针集（将被【整体】删除，共 12 个）：ouroboros/memory.py、ouroboros/consolidator.py、ouroboros/tools/memory_tools.py、ouroboros/cost_projection.py、ouroboros/_usage_response.py、ouroboros/_usage_rows.py、ouroboros/_usage_rows_memo.py、ouroboros/claudexor_daemon.py、ouroboros/claudexor_runtime.py、ouroboros/gateways/claudexor.py、ouroboros/gateway/claudexor_accounts.py、ouroboros/gateway/claudexor_quota.py。AC-0.1/0.2/0.3 必须逐个探测，不得抽查。
- 保护集（部分保留或全部保留，不得当整删，也不是探针目标）：ouroboros/semantic_dedup.py（全保留）、ouroboros/usage_accounting.py 与 ouroboros/usage_ledger.py（保留托管与尝试状态机）、ouroboros/pricing.py（保留 infer_api_key_type/infer_provider_from_model/infer_model_category）、ouroboros/reflection.py（保留 should_generate_reflection、结构化候选、_update_patterns）、ouroboros/tools/knowledge.py（保留 patterns/backlog 路径与 _sanitize_topic/_knowledge_write_lock/_rebuild_knowledge_index）。
- import 期探针有盲区：函数内局部 import 与子进程 import 清单不会被 AC-0.1/0.2/0.3 触发。AC-0.11 是这类命中的兜底，必须交出完整命中清单与逐条处置。
- 不重构 run_llm_loop 的形态：轮顶顺序、tool 回填、终止判定保持原样。
- 不动 background consciousness 的角色边界与工具上限——它是 BIBLE.md:42-45 的 P0 具名实现。
- 不动 identity.md / patterns.md / improvement-backlog.md——它们是 BIBLE P0/P2/P3 保护的本地文件，保持原位且仍是写入 SSOT。
- 每个被删模块的 import 点必须显式处理；禁止新增或保留「吞异常的 import」写法。
- endpoint_index.py 是契约表，任何路由改动必须与 collect_routes() 同 commit。
- ouroboros/size_ratchet_manifest.py 的 GIANT_PATHS 是单向字节棘轮；改动其中文件必须同 commit 更新 manifest。
- 降级契约取「显式不可用」而非静默降级，依据主规格 §9.2 纪律 1。
- HTTP 503 是本仓既有的 unavailable 码（gateway/_helpers.py:208、gateway/claudexor_accounts.py:535）。
- 工具层一律返回标记字符串而非抛异常，与 ESCALATE_UNAVAILABLE、IDENTITY_UPDATE_ABSTAINED、custom_tool_argument_error 一致。
- 异常类型必须定义在删除后仍存在的模块里。
- 摘除端点不在本阶段：AC-0.4/AC-0.9 要求 collect_routes() 条目数不变。
