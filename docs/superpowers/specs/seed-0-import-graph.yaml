- description: AC-0.8 三条逐字契约。(1) HTTP：复用 ouroboros/gateway/_helpers.py:179 的 json_error(message, status)，断言 `json_error("usage unavailable", 503).status_code == 503` 且 body 解码后恰等于 `{"error":"usage unavailable"}`（capability ∈ {usage, cost_projection}）。(2) 异常：新建 ouroboros/errors.py 定义 `class OuroborosUnavailableError(RuntimeError)`；断言 `uv run --locked python -c "from ouroboros.errors import OuroborosUnavailableError as E; assert issubclass(E, RuntimeError); print('OK')"` 输出 `OK` 且退出码 0；不得定义在任何将被删除的模块内。(3) 工具：memory 工具缺席时不抛异常，返回工具结果字符串恰等于 `{"status":"unavailable","reason":"usage"}`。
  verify_command: uv run --locked python -c "import json; from ouroboros.gateway._helpers import json_error; from ouroboros.errors import OuroborosUnavailableError as E; r=json_error('usage unavailable',503); assert r.status_code==503; assert json.loads(bytes(r.body).decode())=={'error':'usage unavailable'}; assert issubclass(E,RuntimeError); print('OK')"
- description: AC-0.9 命令 `uv run --locked python -c "from ouroboros.gateway.router import collect_routes; print(len(collect_routes()))"` 在改动前后输出同一个整数。
  verify_command: uv run --locked python -c "import pathlib; from ouroboros.gateway.router import collect_routes; print(len(collect_routes(data_dir=pathlib.Path('.'))))"
- description: AC-0.10 保护集 6 个模块仍可 import：`uv run --locked python -c "import ouroboros.semantic_dedup, ouroboros.usage_accounting, ouroboros.usage_ledger, ouroboros.pricing, ouroboros.reflection, ouroboros.tools.knowledge; print('OK')"` 期望输出 `OK` 且退出码 0。
  verify_command: uv run --locked python -c "import ouroboros.semantic_dedup, ouroboros.usage_accounting, ouroboros.usage_ledger, ouroboros.pricing, ouroboros.reflection, ouroboros.tools.knowledge; print('OK')"
- description: 'AC-0.11（局部 import 与子进程 import 的盲区）。命令：`for m in memory consolidator memory_tools cost_projection _usage_response _usage_rows _usage_rows_memo claudexor_daemon claudexor_runtime claudexor claudexor_accounts claudexor_quota; do echo "=== $m"; grep -rn --include=''*.py'' -E "(from|import)[^\n]*\b$m\b" ouroboros/ supervisor/ server.py; done` 期望：交付物里附一份**完整命中清单**，且清单中**每一处命中**都标注了处置结论，取值只能是 severing（切掉）、relocating（把符号迁到保留模块后改引）、explicitly-unavailable（显式不可用分支）、not-a-target（该命中属保护集/无关）。判定：清单里不允许存在未被任何处置覆盖的条目；命中数量少于探针集里实际存在的引用数量即失败。为什么需要这一条：AC-0.1/0.2/0.3 的探针只覆盖三个入口的 **import 期传递闭包**，下列两类命中在那时**根本不会执行**，因此永远探不到，必须靠静态清单兜住——(a) **函数内局部 import**，典型是 `server_control.py:161-165` 的 panic 分支，且它被 `except Exception: pass` 吞掉，正常路径永不触发；(b) **子进程 import 清单**，典型是 `update_merge.py:1085-1088` 的 post-apply smoke，路由崩会变成「应用成功但 smoke 失败」→ 静默回滚。已知还须逐条判定的命中包括：`gateway/onboarding.py:441-446`、`delegate_containment.py:132/184`、`subagents.py:419-491`、`review_thread_continuity.py`、`tools/delegate.py`、`tools/plan_review_runtime.py`。'
  verify_exemption_reason: AC-0.11 的交付物是「静态扫描命中清单 + 逐条处置结论」，属于审阅型产物，无法用单条命令判定；扫描命令已在 description 中逐字给出，判定标准是「不存在未被任何处置覆盖的条目」。
