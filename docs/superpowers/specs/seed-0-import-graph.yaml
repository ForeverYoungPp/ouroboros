goal: 在 /home/fy/Projects/code/ouroboros 切断「保留下来的模块」对「将被删除的模块」的全部 import 依赖，使 server
  与 supervisor 在被删模块缺席时仍能正常启动。本阶段不删除任何文件，只改接线。
