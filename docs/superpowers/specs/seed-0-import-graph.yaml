constraints:
- 本阶段不删除任何文件，只切断 import 依赖。
- 探针集（将被【整体】删除，共 12 个）：ouroboros/memory.py、ouroboros/consolidator.py、ouroboros/tools/memory_tools.py、ouroboros/cost_projection.py、ouroboros/_usage_response.py、ouroboros/_usage_rows.py、ouroboros/_usage_rows_memo.py、ouroboros/claudexor_daemon.py、ouroboros/claudexor_runtime.py、ouroboros/gateways/claudexor.py、ouroboros/gateway/claudexor_accounts.py、ouroboros/gateway/claudexor_quota.py。AC-0.1/0.2/0.3
  必须逐个探测，不得抽查。
- 保护集（部分保留或全部保留，不得当整删，也不是探针目标）：ouroboros/semantic_dedup.py（全保留）、ouroboros/usage_accounting.py
  与 ouroboros/usage_ledger.py（保留托管与尝试状态机）、ouroboros/pricing.py（保留 infer_api_key_type/infer_provider_from_model/infer_model_category）、ouroboros/reflection.py（保留
  should_generate_reflection、结构化候选、_update_patterns）、ouroboros/tools/knowledge.py（保留
  patterns/backlog 路径与 _sanitize_topic/_knowledge_write_lock/_rebuild_knowledge_index）。
- import 期探针有盲区：函数内局部 import 与子进程 import 清单不会被 AC-0.1/0.2/0.3 触发。AC-0.11 是这类命中的兜底，必须交出完整命中清单与逐条处置。
- 不重构 run_llm_loop 的形态：轮顶顺序、tool 回填、终止判定保持原样。
- 不动 background consciousness 的角色边界与工具上限——它是 BIBLE.md:42-45 的 P0 具名实现。
- 不动 identity.md / patterns.md / improvement-backlog.md——它们是 BIBLE P0/P2/P3 保护的本地文件，保持原位且仍是写入
  SSOT。
- 每个被删模块的 import 点必须显式处理；禁止新增或保留「吞异常的 import」写法。
- endpoint_index.py 是契约表，任何路由改动必须与 collect_routes() 同 commit。
- ouroboros/size_ratchet_manifest.py 的 GIANT_PATHS 是单向字节棘轮；改动其中文件必须同 commit 更新 manifest。
- 降级契约取「显式不可用」而非静默降级，依据主规格 §9.2 纪律 1。
- HTTP 503 是本仓既有的 unavailable 码（gateway/_helpers.py:208、gateway/claudexor_accounts.py:535）。
- 工具层一律返回标记字符串而非抛异常，与 ESCALATE_UNAVAILABLE、IDENTITY_UPDATE_ABSTAINED、custom_tool_argument_error
  一致。
- 异常类型必须定义在删除后仍存在的模块里。
- 摘除端点不在本阶段：AC-0.4/AC-0.9 要求 collect_routes() 条目数不变。
acceptance_criteria:
- description: 'AC-0.1 对探针集里全部 12 个模块逐个跑 server 导入探针。命令：`for m in ouroboros/memory.py
    ouroboros/consolidator.py ouroboros/tools/memory_tools.py ouroboros/cost_projection.py
    ouroboros/_usage_response.py ouroboros/_usage_rows.py ouroboros/_usage_rows_memo.py
    ouroboros/claudexor_daemon.py ouroboros/claudexor_runtime.py ouroboros/gateways/claudexor.py
    ouroboros/gateway/claudexor_accounts.py ouroboros/gateway/claudexor_quota.py;
    do mv "$m" /tmp/probe_moved.py; python -c "import server" >/dev/null 2>&1; rc=$?;
    mv /tmp/probe_moved.py "$m"; echo "$m EXIT=$rc"; done` 期望：输出 12 行，每行以 `EXIT=0`
    结尾。行数少于 12 即失败；任一行非 0 即失败。'
  semantic_ac_key: ac_d63066648422011b
- description: 'AC-0.2 同一 12 个模块，探针换成 `python -c "import supervisor.events"`。期望：12
    行，每行 `EXIT=0`。'
  semantic_ac_key: ac_8e81f0d3d87b8c7d
- description: 'AC-0.3 同一 12 个模块，探针换成 `python -c "import ouroboros.gateway.extensions"`。期望：12
    行，每行 `EXIT=0`。'
  semantic_ac_key: ac_40ab93d2dba0cb93
- description: 'AC-0.4 命令 `pytest tests/test_gateway_parity.py -q` 期望：退出码 0，stdout
    含 `passed`，无 `failed`。'
  semantic_ac_key: ac_6b5f5d58b5f6546d
- description: 'AC-0.5 命令 `pytest tests/test_server_control_panic_daemon.py -q` 期望：退出码
    0。附加静态检查：`grep -n -A2 claudexor_daemon ouroboros/server_control.py` 的输出中不存在「import
    位于 except 分支为 `except Exception: pass` 或仅 log 的 try 块内」的情形。'
  semantic_ac_key: ac_9defa097fe92374f
- description: 'AC-0.6 命令 `pytest web/tests -q` 期望：退出码 0。前置条件：web/modules/claudexor_status_store.js
    被 7 个模块 import（含 settings.js:21 挂在 app.js 上），改造后这 7 处仍可解析。'
  semantic_ac_key: ac_176349663254bf27
- description: 'AC-0.7 命令 `git diff --stat --diff-filter=D` 期望：输出为空（零个被删除文件）。允许多改动行，但不得有
    `delete mode` 行。'
  semantic_ac_key: ac_240c5665300f656a
- description: 'AC-0.8 三条逐字契约。(1) HTTP：复用 ouroboros/gateway/_helpers.py:179 的 json_error(message,
    status)，断言 `json_error("usage unavailable", 503).status_code == 503` 且 body 解码后恰等于
    `{"error":"usage unavailable"}`（capability ∈ {usage, cost_projection}）。(2) 异常：新建
    ouroboros/errors.py 定义 `class OuroborosUnavailableError(RuntimeError)`；断言 `python
    -c "from ouroboros.errors import OuroborosUnavailableError as E; assert issubclass(E,
    RuntimeError); print(''OK'')"` 输出 `OK` 且退出码 0；不得定义在任何将被删除的模块内。(3) 工具：memory 工具缺席时不抛异常，返回工具结果字符串恰等于
    `{"status":"unavailable","reason":"usage"}`。'
  semantic_ac_key: ac_2b266d22c7513ee5
- description: 'AC-0.9 命令 `python -c "from ouroboros.gateway.router import collect_routes;
    print(len(collect_routes()))"` 在改动前后输出同一个整数。'
  semantic_ac_key: ac_1488c2a98e61b2d2
- description: 'AC-0.10 保护集 6 个模块仍可 import：`python -c "import ouroboros.semantic_dedup,
    ouroboros.usage_accounting, ouroboros.usage_ledger, ouroboros.pricing, ouroboros.reflection,
    ouroboros.tools.knowledge; print(''OK'')"` 期望输出 `OK` 且退出码 0。'
  semantic_ac_key: ac_3a8d49dc443ea45b
- description: 'AC-0.11（局部 import 与子进程 import 的盲区）。命令：`for m in memory consolidator
    memory_tools cost_projection _usage_response _usage_rows _usage_rows_memo claudexor_daemon
    claudexor_runtime claudexor claudexor_accounts claudexor_quota; do echo "=== $m";
    grep -rn --include=''*.py'' -E "(from|import)[^\n]*\b$m\b" ouroboros/ supervisor/
    server.py; done` 期望：交付物里附一份**完整命中清单**，且清单中**每一处命中**都标注了处置结论，取值只能是 severing（切掉）、relocating（把符号迁到保留模块后改引）、explicitly-unavailable（显式不可用分支）、not-a-target（该命中属保护集/无关）。判定：清单里不允许存在未被任何处置覆盖的条目；命中数量少于探针集里实际存在的引用数量即失败。为什么需要这一条：AC-0.1/0.2/0.3
    的探针只覆盖三个入口的 **import 期传递闭包**，下列两类命中在那时**根本不会执行**，因此永远探不到，必须靠静态清单兜住——(a) **函数内局部
    import**，典型是 `server_control.py:161-165` 的 panic 分支，且它被 `except Exception: pass`
    吞掉，正常路径永不触发；(b) **子进程 import 清单**，典型是 `update_merge.py:1085-1088` 的 post-apply
    smoke，路由崩会变成「应用成功但 smoke 失败」→ 静默回滚。已知还须逐条判定的命中包括：`gateway/onboarding.py:441-446`、`delegate_containment.py:132/184`、`subagents.py:419-491`、`review_thread_continuity.py`、`tools/delegate.py`、`tools/plan_review_runtime.py`。'
  semantic_ac_key: ac_8601a3ae1e550234
