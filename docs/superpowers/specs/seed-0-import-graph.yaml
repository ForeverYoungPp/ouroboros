constraints:
- 本阶段不删除任何文件。
- 不重构 run_llm_loop 的形态：轮顶顺序、tool 回填、终止判定保持原样。
- 不动 background consciousness 的角色边界与工具上限——它是 BIBLE.md:42-45 的 P0 具名实现。
- 不动 identity.md / patterns.md / improvement-backlog.md——它们是 BIBLE P0/P2/P3 保护的本地文件，保持原位且仍是写入
  SSOT。
- 每个被删模块的 import 点必须显式处理；禁止新增或保留「吞异常的 import」写法。
- endpoint_index.py 是契约表，任何路由改动必须与 collect_routes() 同 commit，否则 tests/test_gateway_parity.py
  会红。
- 本仓有精确路径的单向字节棘轮：ouroboros/size_ratchet_manifest.py 的 GIANT_PATHS 列出 48 个既有超大文件，字节数只能减不能增；改动这些文件必须同
  commit 更新 manifest。
- semantic_dedup.py 与 tools/knowledge.py 是部分保留、不是整删；切依赖时不得把它们当整删模块处理。
- 降级契约取「显式不可用」而非静默降级：依据是主规格 §9.2 纪律 1（所有被删模块的 import 点必须显式处理）。
- HTTP 503 是本仓既有的 unavailable 码（gateway/_helpers.py:208 的 json_exception(exc, 503)、gateway/claudexor_accounts.py:535）。
- 工具层一律返回标记字符串而非抛异常，与 ⚠️ ESCALATE_UNAVAILABLE、IDENTITY_UPDATE_ABSTAINED、custom_tool_argument_error
  的既有模式一致。
- 异常类型必须定义在一个删除后仍然存在的模块里；被删模块内定义会使类型随模块消失。
- 摘除端点不在本阶段：AC-0.4/AC-0.9 要求 collect_routes() 条目不变。
